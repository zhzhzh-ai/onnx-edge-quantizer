name: Quantizer tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: onnx-edge-quantizer
          auto-activate: false
          channels: conda-forge
          channel-priority: strict
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install tested backends
        run: python scripts/install.py
      - name: Test real conversion and quantization
        run: python -m pytest -q
